<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193a30">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="description" content="A personal planner for tasks and exercise.">
  <title>Daymark — Personal Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e3efb8'/%3E%3Cpath d='M12 5v14M5 12h14M7 7l10 10m0-10L7 17' fill='none' stroke='%23264838' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="training.css">
  <link rel="stylesheet" href="tasks.css">
  <script defer src="schedule.js"></script>
  <script defer src="tasks.js"></script>
  <script defer src="calendar.js"></script>
  <script defer src="training.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to content</a>
  <aside id="sidebar" class="sidebar"></aside>
  <main id="workspace" class="workspace" tabindex="-1">
    <header class="topbar" id="topbar"></header>
    <div class="main-inner">
      <div id="heading"></div>
      <div id="view"></div>
    </div>
  </main>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Main navigation"></nav>
  <dialog id="devices" class="device-dialog" aria-labelledby="device-title"></dialog>
  <dialog id="task-editor" class="device-dialog" aria-labelledby="task-editor-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <noscript>Daymark needs JavaScript to display and save your planner.</noscript>
</body>
</html>
